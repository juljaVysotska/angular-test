<main>
  <ul id="users">
    @for (user of users; track $index) {
       <li>
      <app-user [user]="user" [isSelected]="selectedUser?.id === user.id" (selectedUser)="onUserSelect($event)"></app-user>
    </li>
    }

      <app-user [user]="users[0]"  (selectedUser)="onUserSelect($event)"></app-user>
    </li>
    <li>
      <app-user [user]="users[1]"  (selectedUser)="onUserSelect($event)"></app-user>
    </li> -->
  </ul>


@if (selectedUser) {
  <app-tasks [user]="selectedUser" ></app-tasks>
} @else {
  <div>Select the user</div>
}
